 
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROYAL KIDS PUZZLE</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:15px;text-align:center;
 font-family:Arial,sans-serif;color:white;
 background:linear-gradient(140deg,#16002b,#572078,#16002b);
}
h1{color:#ffd700;text-shadow:0 0 12px orange}
.game{
 max-width:430px;margin:20px auto;
 background:linear-gradient(135deg,#fff4ce,#ffe09a);
 color:#48145c;padding:22px;border-radius:24px;
 border:4px solid gold;box-shadow:0 0 20px gold;
}
.animal{font-size:100px;margin:18px}
button{
 display:block;width:100%;padding:14px;
 margin:9px 0;border:2px solid #b8860b;
 border-radius:14px;background:linear-gradient(90deg,#ffd700,#ffef9a);
 color:#401050;font-size:19px;font-weight:bold;
}
button:active{transform:scale(.97)}
#result{font-size:21px;font-weight:bold}
#win{display:none}
.small{font-size:14px}
</style>
</head>
<body>

<h1>👑 ROYAL KIDS PUZZLE 👑</h1>
<h3>Welcome Kids!</h3>
<p>Let's Play and Learn!</p>

<div class="game" id="game">
<h2>🐾 Animal Puzzle</h2>
<p>Which animal is this?</p>
<div class="animal" id="animal">🐘</div>
<p>Choose the correct answer!</p>
<div id="answers"></div>
<h3 id="score">⭐ Score: 0</h3>
<p id="progress">Question 1 / 50</p>
<p id="result">Good Luck Kids!</p>
<button onclick="next()">Next ➡️</button>
<p class="small">👑 Royal Kids Learning Game</p>
</div>

<div class="game" id="win">
<h1>🏆 YOU WIN! 🏆</h1>
<div style="font-size:85px">👑🎉🥇</div>
<h2>Congratulations!</h2>
<h2 id="finalScore">⭐ 100 POINTS ⭐</h2>
<button onclick="playAgain()">🔄 PLAY AGAIN</button>
</div>

<script>
const animals=[
["🐘","Elephant"],["🦁","Lion"],["🐯","Tiger"],
["🐵","Monkey"],["🐶","Dog"],["🐱","Cat"],
["🐮","Cow"],["🐰","Rabbit"],["🐴","Horse"],
["🐼","Panda"],["🦊","Fox"],["🐻","Bear"],
["🐸","Frog"],["🐧","Penguin"],["🦒","Giraffe"],
["🦓","Zebra"],["🦏","Rhinoceros"],["🦛","Hippo"],
["🐊","Crocodile"],["🐍","Snake"],["🐢","Turtle"],
["🐬","Dolphin"],["🐳","Whale"],["🦈","Shark"],
["🐙","Octopus"],["🦀","Crab"],["🦋","Butterfly"],
["🐝","Bee"],["🐜","Ant"],["🐌","Snail"],
["🐪","Camel"],["🦘","Kangaroo"],["🐨","Koala"],
["🦚","Peacock"],["🦜","Parrot"],["🦉","Owl"],
["🦅","Eagle"],["🐓","Rooster"],["🦆","Duck"],
["🦢","Swan"],["🐑","Sheep"],["🐐","Goat"],
["🐷","Pig"],["🦌","Deer"],["🐿️","Squirrel"],
["🦔","Hedgehog"],["🦥","Sloth"],["🦦","Otter"],
["🦩","Flamingo"]
];

let current=0;
let score=0;
let answered=false;
let questions=[];

function sound(frequency){
 try{
 let ctx=new (window.AudioContext||window.webkitAudioContext)();
 let osc=ctx.createOscillator();
 let gain=ctx.createGain();
 osc.connect(gain);
 gain.connect(ctx.destination);
 osc.frequency.value=frequency;
 gain.gain.setValueAtTime(.15,ctx.currentTime);
 gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.3);
 osc.start();
 osc.stop(ctx.currentTime+.3);
 }catch(e){}
}

function shuffle(arr){
 return [...arr].sort(()=>Math.random()-.5);
}

function startGame(){
 questions=shuffle(animals);
 current=0;
 score=0;
 document.getElementById("score").innerText="⭐ Score: 0";
 document.getElementById("game").style.display="block";
 document.getElementById("win").style.display="none";
 show();
}

function show(){
 let a=questions[current];
 document.getElementById("animal").innerText=a[0];
 document.getElementById("answers").innerHTML="";
 document.getElementById("result").innerText="Choose your answer!";
 document.getElementById("progress").innerText=
 "Question "+(current+1)+" / 50";
 answered=false;

 let wrong=shuffle(animals.filter(x=>x[1]!==a[1])).slice(0,3);
 let choices=shuffle([a,...wrong]);

 choices.forEach(item=>{
 let b=document.createElement("button");
 b.innerText=item[1];
 b.onclick=()=>check(item[1]);
 document.getElementById("answers").appendChild(b);
 });
}

function check(choice){
 if(answered)return;
 answered=true;

 if(choice===questions[current][1]){
 score+=10;
 document.getElementById("result").innerText="🎉 Correct! Very Good!";
 sound(800);
 }else{
 document.getElementById("result").innerText=
 "❌ Correct answer: "+questions[current][1];
 sound(200);
 }

 document.getElementById("score").innerText="⭐ Score: "+score;

 if(score>=100){
 setTimeout(()=>{
 document.getElementById("game").style.display="none";
 document.getElementById("win").style.display="block";
 document.getElementById("finalScore").innerText=
 "⭐ Your Score: "+score;
 sound(1000);
 },400);
 }
}

function next(){
 if(current<49){
 current++;
 show();
 }else{
 document.getElementById("result").innerText=
 "🎉 All 50 questions completed!";
 }
}

function playAgain(){
 startGame();
}

startGame();
</script>
</body>
</html>
