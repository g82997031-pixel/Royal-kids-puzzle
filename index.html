 
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROYAL KIDS PUZZLE</title>
<style>
*{box-sizing:border-box}
body{
 margin:0;padding:15px;text-align:center;
 font-family:Arial,sans-serif;color:white;
 background:linear-gradient(140deg,#16002b,#572078,#16002b);
}
h1{color:#ffd700;text-shadow:0 0 12px orange}
.game{
 max-width:430px;margin:20px auto;
 background:linear-gradient(135deg,#fff4ce,#ffe09a);
 color:#48145c;padding:22px;border-radius:24px;
 border:4px solid gold;box-shadow:0 0 20px gold;
}
.animal{font-size:100px;margin:18px}
button{
 display:block;width:100%;padding:14px;
 margin:9px 0;border:2px solid #b8860b;
 border-radius:14px;
 background:linear-gradient(90deg,#ffd700,#ffef9a);
 color:#401050;font-size:19px;font-weight:bold;
}
button:active{transform:scale(.97)}
#result{font-size:20px;font-weight:bold}
.small{font-size:14px}
.hidden{display:none}
</style>
</head>
<body>

<h1>👑 ROYAL KIDS PUZZLE 👑</h1>
<h3>Welcome Kids!</h3>
<p>Let's Play and Learn!</p>

<!-- HOME MENU -->
<div class="game" id="home">
<h2>🎮 Choose Your Puzzle</h2>
<button onclick="startGame('animal')">🐘 Animal Puzzle</button>
<button onclick="startGame('bus')">🚌 Bus Puzzle</button>
<button onclick="startGame('vehicle')">🚗 Vehicle Puzzle</button>
<p>⭐ Three Fun Games in One App!</p>
</div>

<!-- GAME SCREEN -->
<div class="game hidden" id="game">
<h2 id="gameTitle"></h2>
<p>Which one is this?</p>
<div class="animal" id="animal">🐘</div>
<p>Choose the correct answer!</p>
<div id="answers"></div>
<h3 id="score">⭐ Score: 0</h3>
<p id="progress"></p>
<p id="result">Good Luck Kids!</p>
<button onclick="next()">Next ➡️</button>
<button onclick="goHome()">🏠 Home</button>
</div>

<!-- WIN SCREEN -->
<div class="game hidden" id="win">
<h1>🏆 YOU WIN! 🏆</h1>
<div style="font-size:85px">👑🎉🥇</div>
<h2>Congratulations!</h2>
<h2 id="finalScore"></h2>
<button onclick="playAgain()">🔄 PLAY AGAIN</button>
<button onclick="goHome()">🏠 HOME</button>
</div>

<script>

// ANIMAL PUZZLE - 50 QUESTIONS
const animals=[
["🐘","Elephant"],["🦁","Lion"],["🐯","Tiger"],
["🐵","Monkey"],["🐶","Dog"],["🐱","Cat"],
["🐮","Cow"],["🐰","Rabbit"],["🐴","Horse"],
["🐼","Panda"],["🦊","Fox"],["🐻","Bear"],
["🐸","Frog"],["🐧","Penguin"],["🦒","Giraffe"],
["🦓","Zebra"],["🦏","Rhinoceros"],["🦛","Hippo"],
["🐊","Crocodile"],["🐍","Snake"],["🐢","Turtle"],
["🐬","Dolphin"],["🐳","Whale"],["🦈","Shark"],
["🐙","Octopus"],["🦀","Crab"],["🦋","Butterfly"],
["🐝","Bee"],["🐜","Ant"],["🐌","Snail"],
["🐪","Camel"],["🦘","Kangaroo"],["🐨","Koala"],
["🦚","Peacock"],["🦜","Parrot"],["🦉","Owl"],
["🦅","Eagle"],["🐓","Rooster"],["🦆","Duck"],
["🦢","Swan"],["🐑","Sheep"],["🐐","Goat"],
["🐷","Pig"],["🦌","Deer"],["🐿️","Squirrel"],
["🦔","Hedgehog"],["🦥","Sloth"],["🦦","Otter"],
["🦩","Flamingo"]
];

// BUS PUZZLE - 50 QUESTIONS
const busNames=[
"City Bus","School Bus","Mini Bus","Double Decker Bus",
"Electric Bus","Tourist Bus","Luxury Bus","Sleeper Bus",
"Volvo Bus","Public Bus","Airport Bus","Shuttle Bus",
"Express Bus","Local Bus","Articulated Bus","Trolley Bus",
"Coach Bus","Transit Bus","Hybrid Bus","Mini Coach",
"Intercity Bus","Night Bus","Open Top Bus","Safari Bus",
"Prison Bus","Party Bus","Charter Bus","Rapid Bus",
"Campus Bus","Metro Feeder Bus","Low Floor Bus","Diesel Bus",
"Hydrogen Bus","Airport Shuttle","Tour Coach","City Express",
"School Mini Bus","Long Distance Bus","Double Decker Coach",
"Electric School Bus","Tourist Coach","Sleeper Coach",
"Mini Tourist Bus","Public Transport Bus","Articulated Coach",
"City Shuttle","Luxury Coach","Open Roof Bus",
"Interstate Bus","Community Bus"
];

const busIcons=["🚌","🚍","🚎","🚐"];

const buses=busNames.map((name,i)=>[
 busIcons[i%busIcons.length],name
]);

// VEHICLE PUZZLE - 50 QUESTIONS
const vehicleNames=[
"Car","Taxi","Jeep","SUV","Sports Car",
"Race Car","Police Car","Ambulance","Fire Engine","Truck",
"Pickup Truck","Van","Minivan","Tractor","Bulldozer",
"Excavator","Crane","Motorcycle","Scooter","Bicycle",
"Electric Scooter","Auto Rickshaw","Cycle Rickshaw","Go Kart",
"Dump Truck","Tow Truck","Garbage Truck","Cement Mixer",
"Delivery Van","Monster Truck","Formula Racing Car",
"Convertible Car","Limousine","Vintage Car","Golf Cart",
"Forklift","Road Roller","Tank","ATV","Snowmobile",
"Caravan","Motorhome","Trailer Truck","Flatbed Truck",
"Water Tanker","Fuel Tanker","Ice Cream Van",
"Food Truck","Electric Car","Horse Cart"
];

const vehicleIcons=[
"🚗","🚕","🚙","🏎️","🚓","🚑","🚒","🚚",
"🚛","🚜","🏍️","🛵","🚲","🛺","🚐"
];

const vehicles=vehicleNames.map((name,i)=>[
 vehicleIcons[i%vehicleIcons.length],name
]);

let current=0;
let score=0;
let answered=false;
let questions=[];
let selectedGame="animal";
let gameData={};

gameData.animal=animals;
gameData.bus=buses;
gameData.vehicle=vehicles;

function sound(frequency){
 try{
 let ctx=new(window.AudioContext||window.webkitAudioContext)();
 let osc=ctx.createOscillator();
 let gain=ctx.createGain();
 osc.connect(gain);
 gain.connect(ctx.destination);
 osc.frequency.value=frequency;
 gain.gain.setValueAtTime(.15,ctx.currentTime);
 gain.gain.exponentialRampToValueAtTime(.001,ctx.currentTime+.3);
 osc.start();
 osc.stop(ctx.currentTime+.3);
 }catch(e){}
}

function shuffle(arr){
 return [...arr].sort(()=>Math.random()-.5);
}

function startGame(type){
 selectedGame=type;
 questions=shuffle(gameData[type]);
 current=0;
 score=0;

 document.getElementById("home").classList.add("hidden");
 document.getElementById("win").classList.add("hidden");
 document.getElementById("game").classList.remove("hidden");

 let titles={
 animal:"🐾 Animal Puzzle",
 bus:"🚌 Bus Puzzle",
 vehicle:"🚗 Vehicle Puzzle"
 };

 document.getElementById("gameTitle").innerText=titles[type];
 document.getElementById("score").innerText="⭐ Score: 0";
 show();
}

function show(){
 let a=questions[current];

 document.getElementById("animal").innerText=a[0];
 document.getElementById("answers").innerHTML="";
 document.getElementById("result").innerText="Choose your answer!";
 document.getElementById("progress").innerText=
 "Question "+(current+1)+" / "+questions.length;

 answered=false;

 let wrong=shuffle(
 questions.filter(x=>x[1]!==a[1])
 ).slice(0,3);

 let choices=shuffle([a,...wrong]);

 choices.forEach(item=>{
 let b=document.createElement("button");
 b.innerText=item[1];
 b.onclick=()=>check(item[1]);
 document.getElementById("answers").appendChild(b);
 });
}

function check(choice){
 if(answered)return;
 answered=true;

 if(choice===questions[current][1]){
 score+=10;
 document.getElementById("result").innerText=
 "🎉 Correct! Very Good!";
 sound(800);
 }else{
 document.getElementById("result").innerText=
 "❌ Correct answer: "+questions[current][1];
 sound(200);
 }

 document.getElementById("score").innerText=
 "⭐ Score: "+score;

}

function next(){
 if(!answered){
 document.getElementById("result").innerText=
 "⚠️ Please choose an answer first!";
 return;
 }

 if(current<questions.length-1){
 current++;
 show();
 }else{
 showWin();
 }
}

function showWin(){
 document.getElementById("game").classList.add("hidden");
 document.getElementById("win").classList.remove("hidden");

 document.getElementById("finalScore").innerText=
 "⭐ Your Score: "+score+" / 500";

 sound(1000);
}

function playAgain(){
 startGame(selectedGame);
}

function goHome(){
 document.getElementById("game").classList.add("hidden");
 document.getElementById("win").classList.add("hidden");
 document.getElementById("home").classList.remove("hidden");
}

</script>
</body>
</html>
