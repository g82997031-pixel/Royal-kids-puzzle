<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROYAL KIDS PUZZLE</title>
<style>
body {
  text-align:center;
  background:linear-gradient(135deg,#160b38,#54208b);
  color:white;
  font-family:Arial;
  padding:20px;
}
h1 {color:gold;}
.card {
  background:white;
  color:#32105b;
  padding:20px;
  border-radius:20px;
  max-width:350px;
  margin:auto;
}
.animal {font-size:75px;}
button {
  padding:15px;
  margin:7px;
  border:0;
  border-radius:12px;
  background:gold;
  font-size:20px;
  font-weight:bold;
}
#result {font-size:22px;color:green;}
</style>
</head>
<body>
<h1>👑 ROYAL KIDS PUZZLE 👑</h1>
<h2>🐾 Animal Puzzle</h2>
<div class="card">
<h2>Which animal is this?</h2>
<div class="animal" id="animal">🐘</div>
<div id="options"></div>
<p id="result">Choose the correct answer!</p>
<h3>⭐ Score: <span id="score">0</span></h3>
<button onclick="next()">Next ➡️</button>
</div>
<script>
let animals=[
["🐘","Elephant","Tiger","Lion"],
["🦁","Lion","Dog","Cat"],
["🐯","Tiger","Elephant","Cow"],
["🐶","Dog","Lion","Monkey"],
["🐱","Cat","Tiger","Dog"],
["🐵","Monkey","Cow","Elephant"]
];
let current=0,score=0;
function show(){
 let a=animals[current];
 document.getElementById("animal").innerText=a[0];
 document.getElementById("options").innerHTML="";
 [a[1],a[2],a[3]].sort(()=>Math.random()-.5).forEach(x=>{
 let b=document.createElement("button");
 b.innerText=x;
 b.onclick=()=>check(x);
 document.getElementById("options").appendChild(b);
 });
 document.getElementById("result").innerText="Choose the correct answer!";
}
function check(x){
 let a=animals[current];
 if(x===a[1]){
 score++;
 document.getElementById("score").innerText=score;
 document.getElementById("result").innerText="🎉 Correct! Very Good!";
 }else{
 document.getElementById("result").innerText="😊 Try again!";
 }
}
function next(){
 current=(current+1)%animals.length;
 show();
}
show();
</script><script>
document.querySelectorAll('img').forEach(img => {
  img.addEventListener('click', () => {
    const sounds = {
      dog: '🐶',
      cat: '🐱',
      elephant: '🐘'
    };
    const name = img.alt.toLowerCase();
    const emoji = Object.keys(sounds).find(k => name.includes(k));
    if (emoji) {
      const speech = new SpeechSynthesisUtterance(emoji);
      speech.lang = 'en-US';
      speechSynthesis.speak(speech);
    }
  });
});
                       </script>
</body>
</html>
