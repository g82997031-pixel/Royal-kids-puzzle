 
<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ROYAL KIDS PUZZLE</title>
<style>
body {
  text-align:center;
  background:linear-gradient(135deg,#17002e,#5b168b);
  color:white;
  font-family:Arial;
  padding:15px;
}
h1 {color:gold;}
.game {
  background:#fff3cf;
  color:#401050;
  padding:20px;
  border-radius:20px;
  max-width:400px;
  margin:auto;
}
.animal {font-size:100px;margin:20px;}
button {
  background:gold;
  color:#321047;
  border:2px solid #fff;
  padding:14px;
  margin:7px;
  border-radius:12px;
  font-size:19px;
  font-weight:bold;
  width:85%;
}
button:active {background:orange;}
#result {font-size:22px;font-weight:bold;}
</style>
</head>
<body>

<h1>👑 ROYAL KIDS PUZZLE 👑</h1>
<h3>Welcome Kids!</h3>
<p>Let's Play and Learn!</p>

<div class="game">
<h2>🐾 Animal Puzzle</h2>
<p>Which animal is this?</p>

<div class="animal" id="animal">🐘</div>

<p>Choose the correct answer!</p>

<div id="answers"></div>

<h3 id="score">⭐ Score: 0</h3>
<p id="result">Good Luck Kids!</p>

<button onclick="next()">Next ➡️</button>
</div>

<script>
let animals = [
["🐘","Elephant","Tiger","Lion","Dog"],
["🦁","Lion","Cat","Cow","Horse"],
["🐯","Tiger","Dog","Elephant","Goat"],
["🐵","Monkey","Lion","Cow","Cat"],
["🐶","Dog","Tiger","Goat","Elephant"],
["🐱","Cat","Horse","Lion","Monkey"],
["🐮","Cow","Dog","Tiger","Lion"],
["🐰","Rabbit","Elephant","Cat","Horse"],
["🐴","Horse","Monkey","Dog","Cow"],
["🐼","Panda","Lion","Tiger","Cat"]
];

let current=0;
let score=0;
let answered=false;

function show(){
let a=animals[current];
document.getElementById("animal").innerText=a[0];
document.getElementById("answers").innerHTML="";
document.getElementById("result").innerText="Choose your answer!";

a.slice(1).sort(()=>Math.random()-0.5).forEach(choice=>{
let b=document.createElement("button");
b.innerText=choice;
b.onclick=()=>check(choice);
document.getElementById("answers").appendChild(b);
});
answered=false;
}

function check(choice){
if(answered)return;
answered=true;
if(choice===animals[current][1]){
score+=10;
document.getElementById("result").innerText="🎉 Correct! Very Good!";
}else{
document.getElementById("result").innerText=
"❌ Try again next time! Answer: "+animals[current][1];
}
document.getElementById("score").innerText="⭐ Score: "+score;

if(score>=100){
document.getElementById("result").innerText="🏆 YOU WIN! 100 POINTS!";
}
}

function next(){
current=(current+1)%animals.length;
show();
}

show();
</script>

</body>
</html>
